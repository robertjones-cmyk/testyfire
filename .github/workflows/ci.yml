name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate replay fixtures
        run: python scripts/make_fixtures.py

      - name: Tests (fusion, view change, security, dispatch, blind spot)
        run: python -m pytest -v

      - name: Contrast check on design tokens (fails below WCAG AA)
        run: python scripts/check_contrast.py

      - name: pip-audit
        run: pip-audit --requirement requirements.txt --strict

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend build, audit and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: npm audit
        working-directory: web
        run: npm audit --audit-level=high
        continue-on-error: true   # advisory: do not block on transitive dev advisories

      - name: Typecheck and build
        working-directory: web
        run: npm run build

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare demo data and an account for the a11y run
        env:
          DISPATCH_HMAC_SECRET: ci-only-not-a-real-secret-0000000000000000
        run: |
          python scripts/make_fixtures.py
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from app import db
          from app.config import get_config
          from app.security.auth import create_user
          config = get_config()
          db.configure(config.db_path)
          db.init_db()
          create_user('admin@torchsystems.com', 'prototype-demo-password', 'admin')
          PY
          python -m app poll-once

      - name: Start the API (which serves the built frontend)
        env:
          DISPATCH_HMAC_SECRET: ci-only-not-a-real-secret-0000000000000000
        run: |
          python -m app run &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Accessibility tests (axe-core, every screen, both themes)
        working-directory: web
        run: npx playwright test

      - name: Upload accessibility failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results/
