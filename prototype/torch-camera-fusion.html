<title>Torch Camera Fusion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* ===========================================================================
   Torch UI tokens — taken from the platform's design system, not invented here.
   Light palette on bare :root; dark redefines only the token values.
   =========================================================================== */
:root {
  --brand: oklch(68.38% .2092 37.3);          /* Torch orange — accent only */
  --brand-600: oklch(56% .1955 34.9);         /* orange safe for text on light */
  --primary: oklch(20.99% .034 263.44);       /* near-black navy */

  --page: oklch(98.36% .0021 197.12);
  --surface: #fff;
  --sunken: oklch(96.26% .0021 197.12);

  --text: oklch(32.62% .0114 214.47);
  --text-strong: var(--primary);
  --text-muted: oklch(52.18% .021 209.44);    /* 5.4:1 on white */
  --border: oklch(84.89% .0092 214.35);
  --border-strong: oklch(63% .0198 209.43);   /* 3.2:1 — UI components need 3:1 */
  --divider: oklch(92.52% .0045 214.33);

  --ok: oklch(67.31% .1596 155.59);
  --warn: oklch(74.69% .1701 62.11);
  --bad: oklch(63.71% .2104 28.54);
  --info: oklch(67.46% .1414 261.34);
  /* Text-safe variants: the raw status hues fail 4.5:1 as text. */
  --ok-text: oklch(44% .12 155.59);
  --warn-text: oklch(46% .115 62.11);
  --bad-text: oklch(47% .18 28.54);
  --info-text: oklch(47% .13 261.34);

  --chip-possible-bg: oklch(92.52% .0045 214.33);
  --chip-possible-fg: oklch(29.03% .0117 214.51);
  --chip-verified-bg: oklch(94% .04 28.54);
  --chip-sensor-bg: oklch(94% .05 62.11);
  --chip-demo-bg: oklch(93% .05 261.34);

  --btn-bg: var(--primary);
  --btn-fg: #fff;
  --link: var(--brand-600);

  --r-card: 12px;
  --r-ctrl: 8px;
  --r-pill: 999px;
  --r-tag: 4px;
  --shadow-card: 0 1px 2px oklch(0% 0 0 / 6%);
  --shadow-float: 0 12px 16px -4px oklch(0% 0 0 / 8%);
  --sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --sidebar: 236px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: oklch(20.5% .011 216);
    --surface: oklch(23.32% .0109 216.94);
    --sunken: oklch(29.03% .0117 214.51);
    --primary: oklch(96% .01 214);
    --text: oklch(93% .01 214);
    --text-strong: oklch(96% .01 214);
    --text-muted: oklch(84% .012 214);
    --border: oklch(35% .014 214);
    --border-strong: oklch(52% .016 214);
    --divider: oklch(32% .012 214);
    --ok-text: oklch(78% .15 155.59);
    --warn-text: oklch(82% .15 62.11);
    --bad-text: oklch(74% .18 28.54);
    --info-text: oklch(78% .13 261.34);
    --chip-possible-bg: oklch(32% .01 214);
    --chip-possible-fg: oklch(92% .01 214);
    --chip-verified-bg: oklch(30% .07 28.54);
    --chip-sensor-bg: oklch(30% .06 62.11);
    --chip-demo-bg: oklch(30% .06 261.34);
    --btn-bg: oklch(94% .006 214);
    --btn-fg: oklch(20.99% .034 263.44);
    --link: var(--brand);
    --shadow-card: 0 1px 3px oklch(0% 0 0 / 30%);
    --shadow-float: 0 12px 16px -4px oklch(0% 0 0 / 40%);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: oklch(20.5% .011 216);
  --surface: oklch(23.32% .0109 216.94);
  --sunken: oklch(29.03% .0117 214.51);
  --primary: oklch(96% .01 214);
  --text: oklch(93% .01 214);
  --text-strong: oklch(96% .01 214);
  --text-muted: oklch(84% .012 214);
  --border: oklch(35% .014 214);
  --border-strong: oklch(52% .016 214);
  --divider: oklch(32% .012 214);
  --ok-text: oklch(78% .15 155.59);
  --warn-text: oklch(82% .15 62.11);
  --bad-text: oklch(74% .18 28.54);
  --info-text: oklch(78% .13 261.34);
  --chip-possible-bg: oklch(32% .01 214);
  --chip-possible-fg: oklch(92% .01 214);
  --chip-verified-bg: oklch(30% .07 28.54);
  --chip-sensor-bg: oklch(30% .06 62.11);
  --chip-demo-bg: oklch(30% .06 261.34);
  --btn-bg: oklch(94% .006 214);
  --btn-fg: oklch(20.99% .034 263.44);
  --link: var(--brand);
  --shadow-card: 0 1px 3px oklch(0% 0 0 / 30%);
  --shadow-float: 0 12px 16px -4px oklch(0% 0 0 / 40%);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  font-weight: 600;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--page);
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3 { color: var(--text-strong); margin: 0; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
h1 { font-size: 20px; }
h2 { font-size: 16px; }
h3 { font-size: 14px; }
p { margin: 0; }
a { color: var(--link); }
:focus-visible {
  outline: 2px solid transparent;
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--brand-600);
  border-radius: var(--r-ctrl);
}
.vh { position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* ---------- shell ---------- */
.shell { display: flex; min-height: 100%; }
.sidebar {
  width: var(--sidebar); flex: none;
  background: var(--surface); border-right: 1px solid var(--border);
  padding: 18px 14px; display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; align-items: center; gap: 11px; }
.tile {
  width: 40px; height: 40px; border-radius: var(--r-card); background: var(--brand);
  display: grid; place-items: center; color: #fff; flex: none;
}
.brand b { display:block; font-size: 15px; color: var(--text-strong); line-height:1.15; }
.brand span { font-size: 12px; color: var(--text-muted); font-weight: 600; }
.nav { display: flex; flex-direction: column; gap: 2px; list-style: none; margin: 0; padding: 0; }
.nav button {
  display: flex; align-items: center; gap: 10px; width: 100%;
  min-height: 44px; padding: 9px 12px; border: 0; background: none;
  font: inherit; font-weight: 600; color: var(--text); cursor: pointer;
  border-radius: var(--r-ctrl); position: relative; text-align: left;
}
.nav button:hover { background: var(--sunken); }
.nav button[aria-current="page"] { background: var(--sunken); color: var(--text-strong); }
.nav button[aria-current="page"]::before {
  content:''; position:absolute; left:0; top:9px; bottom:9px; width:3px;
  border-radius:3px; background: var(--brand);
}
.nav .count {
  margin-left:auto; font-size:11px; font-weight:700; padding:1px 8px;
  border:1px solid var(--border-strong); border-radius: var(--r-pill); color: var(--text);
}
.side-note {
  margin-top:auto; font-size:11px; color: var(--text-muted); font-weight:600;
  border-top:1px solid var(--divider); padding-top:12px; line-height:1.45;
}

.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding: 11px 24px; background: var(--surface); border-bottom:1px solid var(--border);
}
.topbar h1 { margin-right:auto; }
.clock { font-size:12px; color: var(--text-muted); font-weight:600; font-variant-numeric: tabular-nums; }

.content { padding: 24px; display:flex; flex-direction:column; gap:18px; }

/* ---------- demo strip ---------- */
.demo-strip {
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:14px 16px; background: var(--surface);
  border:1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow-card);
}
.demo-strip .lead { font-size:13px; color: var(--text-muted); max-width: 46ch; }
.demo-strip .lead b { color: var(--text-strong); }
.steps { display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; }
.step {
  font-size:11px; font-weight:700; padding:3px 9px; border-radius: var(--r-pill);
  border:1px solid var(--border); color: var(--text-muted); white-space:nowrap;
}
.step[data-on="1"] { border-color: var(--brand); color: var(--brand-600); background: oklch(97% .0166 40.8); }
/* Brand orange is only safe as text on the DARK ground (5.4:1); on light it is
   3.1:1, so light mode keeps brand-600. Both dark states need stating. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .step[data-on="1"] { background: transparent; color: var(--brand); }
}
:root[data-theme="dark"] .step[data-on="1"] { background: transparent; color: var(--brand); }

button.btn {
  font: inherit; font-weight:700; cursor:pointer; min-height:44px; padding:0 16px;
  border-radius: var(--r-ctrl); border:1px solid var(--border-strong);
  background: var(--surface); color: var(--text);
}
button.btn:hover { background: var(--sunken); }
button.btn.primary { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
button.btn:disabled { opacity:.5; cursor:not-allowed; }
button.icon {
  font: inherit; cursor:pointer; min-height:36px; min-width:36px; padding:0 10px;
  border-radius: var(--r-ctrl); border:1px solid var(--border-strong);
  background: var(--surface); color: var(--text); font-weight:600; font-size:12px;
}

/* ---------- cards ---------- */
.card {
  background: var(--surface); border:1px solid var(--border);
  border-radius: var(--r-card); box-shadow: var(--shadow-card); padding:18px;
}
.card > h2 { margin-bottom: 4px; }
.sub { font-size:12px; color: var(--text-muted); }
.grid { display:grid; gap:16px; }
.cols-2 { grid-template-columns: minmax(0,1.35fr) minmax(0,1fr); }
.cols-3 { grid-template-columns: repeat(auto-fill, minmax(215px,1fr)); }
.cols-kpi { grid-template-columns: repeat(auto-fill, minmax(168px,1fr)); }

/* ---------- chips ---------- */
.chip {
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  padding:3px 10px 3px 8px; border-radius: var(--r-pill);
  font-size:12px; font-weight:700; border:1px solid transparent;
}
.chip svg { flex:none; }
.chip.possible { background: var(--chip-possible-bg); color: var(--chip-possible-fg); border-color: var(--border-strong); }
.chip.verified { background: var(--chip-verified-bg); color: var(--bad-text); border-color: oklch(80% .1 28.54); }
.chip.sensor   { background: var(--chip-sensor-bg);   color: var(--warn-text); border-color: oklch(80% .12 62.11); }
.chip.demo     { background: var(--chip-demo-bg);     color: var(--info-text); border-color: oklch(80% .1 261.34); }

.dot { width:9px; height:9px; border-radius:50%; display:inline-block; border:1px solid oklch(0% 0 0 / 25%); flex:none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }

/* ---------- tables ---------- */
.tablewrap { overflow-x:auto; }
table { border-collapse: collapse; width:100%; font-size:13px; }
th, td { text-align:left; padding:11px 14px; border-bottom:1px solid var(--divider); }
th { color: var(--text-strong); font-weight:700; font-size:12px; background: var(--sunken); white-space:nowrap; }
tbody tr { cursor:pointer; }
tbody tr:hover { background: var(--sunken); }
tbody tr[aria-selected="true"] { background: var(--sunken); }
td.num { font-variant-numeric: tabular-nums; }

/* ---------- KPI ---------- */
.kpi { display:flex; flex-direction:column; gap:3px; }
.kpi .k { font-size:11px; font-weight:700; color: var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
.kpi .v { font-size:26px; font-weight:800; color: var(--text-strong); font-variant-numeric: tabular-nums; }
.kpi .m { font-size:12px; color: var(--text-muted); }

/* ---------- camera cards ---------- */
.cam { background: var(--surface); border:1px solid var(--border); border-radius: var(--r-card); overflow:hidden; }
.cam img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; max-width:100%; }
.cam .body { padding:11px 12px; display:flex; flex-direction:column; gap:3px; }
.cam .nm { font-weight:700; color: var(--text-strong); font-size:13px; }
.cam .mt { font-size:12px; color: var(--text-muted); }
.flag { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color: var(--warn-text); }
.feedbadge {
  font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
  padding:2px 7px; border-radius: var(--r-tag); border:1px solid var(--border-strong);
  background: var(--sunken); color: var(--text);
}
.feederr {
  display:flex; gap:7px; align-items:flex-start; font-size:12px; font-weight:600;
  color: var(--warn-text); background: var(--sunken);
  border-radius: var(--r-ctrl); padding:9px 11px; margin-top:10px;
}

/* ---------- detail panel ---------- */
.facts { display:flex; flex-direction:column; }
.fact { display:flex; gap:12px; padding:7px 0; border-bottom:1px solid var(--divider); font-size:13px; }
.fact dt { flex:0 0 132px; color: var(--text-muted); margin:0; }
.fact dd { margin:0; color: var(--text); }
.frame { position:relative; border-radius: var(--r-ctrl); overflow:hidden; border:1px solid var(--border); }
.frame img { display:block; width:100%; max-width:100%; }
.bbox { position:absolute; border:2px solid var(--brand); border-radius:4px; box-shadow:0 0 0 2px oklch(0% 0 0 / 35%); }
.timeline { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; font-size:13px; }
.timeline li { display:flex; gap:11px; }
.timeline .t { color: var(--text-muted); flex:0 0 74px; font-variant-numeric: tabular-nums; }

.callout {
  border-left:3px solid var(--border-strong); padding:10px 0 10px 13px;
  font-size:13px; color: var(--text-muted); background:none; max-width:64ch;
}
.callout.rule { border-left-color: var(--brand); }
.callout b { color: var(--text-strong); }

/* ---------- dispatch console ---------- */
.console {
  background: oklch(23.32% .0109 216.94); color: oklch(93% .01 214);
  border-radius: var(--r-ctrl); padding:14px; font-size:12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  overflow-x:auto; line-height:1.55; border:1px solid oklch(35% .014 214);
}
.console .g { color: oklch(78% .15 155.59); }
.console .o { color: oklch(78% .13 261.34); }
.console .d { color: oklch(72% .012 214); }
.console pre { margin:0; white-space:pre; }

/* ---------- map ---------- */
.mapcard { padding:0; overflow:hidden; }
.mapsvg { display:block; width:100%; height:auto; background: var(--sunken); }
.legend { display:flex; flex-wrap:wrap; gap:14px; padding:13px 16px; border-top:1px solid var(--divider); font-size:12px; }
.legend span { display:inline-flex; align-items:center; gap:7px; color: var(--text-muted); font-weight:600; }
.sw { width:17px; height:11px; border-radius:3px; display:inline-block; flex:none; }

.listpanel { display:flex; flex-direction:column; gap:7px; }
.listitem {
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  min-height:44px; padding:9px 12px; font:inherit; cursor:pointer;
  background: var(--surface); border:1px solid var(--border); border-radius: var(--r-ctrl); color: var(--text);
}
.listitem:hover { background: var(--sunken); }
.listitem .nm { font-weight:700; color: var(--text-strong); font-size:13px; }
.listitem .mt { font-size:12px; color: var(--text-muted); }

.bar { height:6px; border-radius:var(--r-pill); background: var(--divider); overflow:hidden; }
.bar > i { display:block; height:100%; background: var(--warn); transition: width .35s linear; }
.bar > i.hot { background: var(--bad); }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .001ms !important; animation-duration: .001ms !important; }
}

@media (max-width: 900px) {
  .cols-2 { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .shell { flex-direction:column; }
  .sidebar { width:100%; border-right:0; border-bottom:1px solid var(--border); }
  .nav { flex-direction:row; flex-wrap:wrap; }
  .nav button { width:auto; }
  .side-note { display:none; }
  .content, .topbar { padding-left:16px; padding-right:16px; }
}
</style>

<div class="shell">
  <nav class="sidebar" aria-label="Main">
    <div class="brand">
      <span class="tile" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c2.2 2.8 3.4 5.1 3.4 6.9 0 1.4-.7 2.4-1.7 2.9.4-1.4-.2-2.7-1.3-3.8-.5 2-1.6 2.9-2.7 4.2-1 1.2-1.5 2.4-1.5 3.7 0 2.7 2.2 4.8 5 4.8s5-2.2 5-5.1C18.2 11.5 15.3 7.7 12 2Z"/></svg>
      </span>
      <span><b>Torch</b><span>Camera Fusion</span></span>
    </div>
    <ul class="nav" id="nav"></ul>
    <p class="side-note">Interactive prototype.<br>Mock data, no backend.</p>
  </nav>

  <div class="main">
    <header class="topbar">
      <h1 id="screenTitle">Map</h1>
      <span class="clock" id="clock">17:42 MDT</span>
      <button class="icon" id="themeBtn" aria-pressed="false">Dark</button>
    </header>

    <div class="content">
      <section class="demo-strip" aria-labelledby="demoH">
        <h2 id="demoH" class="vh">Demo controls</h2>
        <p class="lead" id="demoLead">
          A camera has flagged <b>possible smoke</b>. Nobody has been paged.
          Run the fire scenario to make a Torch sensor agree.
        </p>
        <div class="steps" id="steps"></div>
        <button class="btn primary" id="runBtn">Run fire scenario</button>
        <button class="btn" id="resetBtn">Reset</button>
      </section>

      <main id="screen"></main>
    </div>
  </div>

<script>
/* ===========================================================================
   State. Mirrors the real prototype's data model: cameras, sensors, events,
   and the one product rule that possible_smoke never dispatches.
   =========================================================================== */
const SMOKE_THRESHOLD = 60;   // sensors.thresholds.smoke_index
const SCORE_THRESHOLD = 0.55; // detection.score_threshold

const S = {
  screen: 'map',
  scenario: 'idle',      // idle | ramping | verified
  smokeIndex: 12.4,
  thermalDelta: 1.2,
  selectedEvent: 1,
  dispatches: [{
    id: 2, status: 'sensor_only', severity: 'Warning', sensor: 'TS-007',
    at: '17:25', detail: 'Sensor TS-007: smoke/gas index 105 ≥ 60', demo: false,
  }],
};

const CAMERAS = [
  { id:'bosque_c', name:'Bosque Central', feed:'demo_local', img:'smoke', score:0.68,
    moved:false, changes:0, heading:170, fov:62 },
  { id:'bosque_n', name:'Bosque North', feed:'demo_local', img:'north_moved', score:0.00,
    moved:true, changes:1, heading:200, fov:62 },
  { id:'bosque_s', name:'Bosque South', feed:'demo_local', img:'south', score:0.00,
    moved:false, changes:0, heading:300, fov:62 },
];

const SENSORS = [
  { id:'TS-001', name:'Bosque N 1', smoke:11 }, { id:'TS-002', name:'Bosque N 2', smoke:9 },
  { id:'TS-003', name:'Bosque C 1', smoke:14 }, { id:'TS-004', name:'Bosque C 2', smoke:12.4, hero:true },
  { id:'TS-005', name:'Bosque C 3', smoke:10 }, { id:'TS-006', name:'Bosque S 1', smoke:13 },
  { id:'TS-007', name:'Bosque S 2', smoke:105, alarm:true }, { id:'TS-008', name:'Bosque S 3', smoke:8 },
];

/* ---- small helpers ---- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const ICON = {
  question:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>',
  shield:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3z"/><path d="m9 12 2 2 4-4"/></svg>',
  radio:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19 5a10 10 0 0 1 0 14M5 19a10 10 0 0 1 0-14"/></svg>',
  alert:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  cam:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
};

const chip = (kind) => {
  if (kind === 'verified') return `<span class="chip verified">${ICON.shield}Verified</span>`;
  if (kind === 'sensor_only') return `<span class="chip sensor">${ICON.radio}Sensor only</span>`;
  return `<span class="chip possible">${ICON.question}Possible smoke</span>`;
};
const demoChip = () => `<span class="chip demo">${ICON.alert}DEMO</span>`;

/* ---- derived state ---- */
const eventStatus = () => (S.scenario === 'verified' ? 'verified' : 'possible_smoke');
const isVerified = () => S.scenario === 'verified';

/* ===========================================================================
   Navigation
   =========================================================================== */
const SCREENS = [
  { id:'map', label:'Map' },
  { id:'events', label:'Events', badge: () => (isVerified() ? 2 : 2) },
  { id:'cameras', label:'Cameras' },
  { id:'dashboard', label:'Dashboard' },
];

function renderNav() {
  $('#nav').innerHTML = SCREENS.map((s) => `
    <li><button type="button" data-screen="${s.id}" ${S.screen === s.id ? 'aria-current="page"' : ''}>
      ${esc(s.label)}${s.badge ? `<span class="count">${s.badge()}<span class="vh"> events</span></span>` : ''}
    </button></li>`).join('');
  $('#screenTitle').textContent = SCREENS.find((s) => s.id === S.screen).label;
}

/* ===========================================================================
   Map — a schematic of the Rio Grande bosque corridor. No tiles, no token.
   =========================================================================== */
function mapScreen() {
  const hot = S.scenario !== 'idle';
  return `
  <div class="grid cols-2">
    <section class="card mapcard" aria-labelledby="mapH">
      <h2 id="mapH" class="vh">Corridor map</h2>
      <svg class="mapsvg" viewBox="74 8 284 452" role="img"
           aria-label="Schematic of the Rio Grande bosque corridor showing three cameras, their view cones, blind-spot areas, Torch sensors and proposed sensor placements">
        <defs>
          <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="7" height="7" fill="none"/>
            <line x1="0" y1="0" x2="0" y2="7" stroke="var(--text-muted)" stroke-width="2" opacity="0.42"/>
          </pattern>
        </defs>

        <!-- corridor (area of interest) -->
        <path d="M138 24 L172 24 L186 150 L196 250 L214 360 L228 446 L188 446 L176 360 L158 250 L148 150 Z"
              fill="url(#hatch)" stroke="var(--ok)" stroke-width="2"/>

        <!-- river centreline -->
        <path d="M156 26 L168 150 L176 250 L196 360 L208 444"
              fill="none" stroke="var(--info)" stroke-width="3.5" opacity="0.75" stroke-linecap="round"/>

        <!-- camera view cones -->
        <path d="M150 96 L104 178 L198 178 Z" fill="var(--info)" opacity="0.2"/>
        <path d="M150 96 L104 178 L198 178 Z" fill="none" stroke="var(--info)" stroke-width="1.6"/>
        <path d="M166 232 L120 316 L214 316 Z" fill="var(--info)" opacity="0.2"/>
        <path d="M166 232 L120 316 L214 316 Z" fill="none" stroke="var(--info)" stroke-width="1.6"/>
        <path d="M212 392 L158 440 L252 430 Z" fill="var(--info)" opacity="0.2"/>
        <path d="M212 392 L158 440 L252 430 Z" fill="none" stroke="var(--info)" stroke-width="1.6"/>

        <!-- proposed sensors: dashed, distinguishable without colour -->
        ${[[162,54],[150,122],[176,196],[160,272],[190,338],[178,300],[204,404],[214,430],[170,160],[186,232]]
          .map(([x, y]) => `<circle cx="${x}" cy="${y}" r="13" fill="none" stroke="var(--brand)" stroke-width="1.8" stroke-dasharray="3 3"/>`).join('')}

        <!-- cameras -->
        ${[[150,96,'Bosque North'],[166,232,'Bosque Central'],[212,392,'Bosque South']].map(([x, y, n]) => `
          <g><rect x="${x - 9}" y="${y - 9}" width="18" height="18" rx="5" fill="oklch(35% .05 261.34)"/>
          <circle cx="${x}" cy="${y}" r="3.2" fill="#fff"/>
          <title>Camera ${n}</title></g>`).join('')}

        <!-- sensors -->
        ${[[158,60,'TS-001'],[146,128,'TS-002'],[172,190,'TS-003'],[170,250,'TS-004'],
           [182,300,'TS-005'],[196,352,'TS-006'],[206,410,'TS-007'],[218,438,'TS-008']].map(([x, y, id]) => {
             const isHero = id === 'TS-004';
             const alarm = (isHero && hot) || id === 'TS-007';
             const fill = alarm ? 'var(--bad)' : 'var(--ok)';
             return `<g><circle cx="${x}" cy="${y}" r="${isHero && hot ? 8 : 6}" fill="${fill}" stroke="var(--surface)" stroke-width="2"/>
               ${alarm ? `<text x="${x}" y="${y + 3.4}" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">!</text>` : ''}
               <title>Sensor ${id}</title></g>`;
           }).join('')}

        <text x="82" y="30" font-size="11" font-weight="700" fill="var(--text-muted)">N</text>
        <text x="82" y="44" font-size="10" fill="var(--text-muted)">Schematic —</text>
        <text x="82" y="57" font-size="10" fill="var(--text-muted)">not to scale</text>
      </svg>
      <div class="legend">
        <span><i class="sw" style="background:oklch(35% .05 261.34)"></i>Camera</span>
        <span><i class="sw" style="background:var(--info);opacity:.45"></i>View cone</span>
        <span><i class="sw" style="background:repeating-linear-gradient(45deg,var(--text-muted) 0 2px,transparent 2px 5px);border:1px solid var(--border-strong)"></i>Blind spot</span>
        <span><i class="sw" style="border:2px dashed var(--brand);height:14px"></i>Proposed sensor</span>
        <span><i class="sw" style="background:var(--ok);border-radius:50%;width:12px"></i>Sensor</span>
      </div>
    </section>

    <div class="grid" style="align-content:start">
      <section class="card" aria-labelledby="covH">
        <h2 id="covH">Coverage</h2>
        <p class="sub" style="margin-top:6px">
          Cameras see <b style="color:var(--text-strong)">5.8%</b> of the corridor.
          1,200 sensors cover 7,297 of the 7,495 blind acres.
          Hardware cost 1,200 &times; $299 = <b style="color:var(--text-strong)">$358,800</b>.
        </p>
        <div class="callout" style="margin-top:12px">
          Bare-earth viewshed from a public elevation model. Canopy, buildings and camera
          optics are not modelled, and only the three replay cameras are live — so this
          percentage rises once the real NMDOT feed is ingesting.
        </div>
      </section>

      <section class="card" aria-labelledby="listH">
        <h2 id="listH">Map contents</h2>
        <p class="sub" style="margin-bottom:11px">
          Everything on the map is here too — the map is never the only way in.
        </p>
        <div class="listpanel">
          ${CAMERAS.map((c) => `
            <button type="button" class="listitem" data-goto="cameras">
              ${ICON.cam}
              <span><span class="nm">${esc(c.name)}</span>
              <span class="mt">score ${c.score.toFixed(2)}${c.moved ? ' · view changed' : ''}</span></span>
            </button>`).join('')}
          <button type="button" class="listitem" data-goto="events">
            ${ICON.radio}
            <span><span class="nm">TS-004 · Bosque C 2</span>
            <span class="mt">smoke index ${S.smokeIndex.toFixed(0)}${hot ? ' · rising' : ''}</span></span>
          </button>
        </div>
      </section>
    </div>
  </div>`;
}

          <thead><tr>
            <th scope="col">Status</th><th scope="col">Severity</th>
            <th scope="col">Source</th><th scope="col">Score</th><th scope="col">Detected</th>
          </tr></thead>
          <tbody id="evBody">
            ${rows.map((r) => `
              <tr data-event="${r.id}" tabindex="0" aria-selected="${S.selectedEvent === r.id}"
                  aria-label="Event ${r.id}, ${r.status.replace('_', ' ')}, open details">
                <td>${chip(r.status)}${r.demo ? ' ' + demoChip() : ''}</td>
                <td>${r.sev}</td><td>${esc(r.src)}</td>
                <td class="num">${r.score}</td><td class="num">${r.at}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </section>

    <section class="card" aria-labelledby="detH">
      <h2 id="detH">Event ${S.selectedEvent}</h2>
      <div style="margin-top:12px">${S.selectedEvent === 1 ? eventOne() : eventTwo()}</div>
    </section>
  </div>`;
}

function eventOne() {
  const verified = isVerified();
  return `
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px">
      ${chip(eventStatus())}${verified ? demoChip() : ''}
    </div>

    <figure class="frame" style="margin:0">
      <img src="${FRAMES.smoke}" alt="Camera Bosque Central, 5:42 PM, possible smoke detected in middle centre, score 0.68">
      <span class="bbox" style="left:32.5%;top:36.3%;width:8.75%;height:14.8%"></span>
    </figure>
    <p class="sub" style="margin-top:7px">
      Camera Bosque Central, 5:42 PM, possible smoke detected in middle centre, score 0.68.
    </p>

    <dl class="facts" style="margin-top:13px">
      <div class="fact"><dt>Camera score</dt><dd>0.68 (threshold ${SCORE_THRESHOLD})</dd></div>
      <div class="fact"><dt>Confirming sensor</dt><dd>${
        verified ? 'TS-004, 123 m from the camera' : '<span style="color:var(--text-muted)">none yet</span>'}</dd></div>
      <div class="fact"><dt>Sensor reading</dt><dd>${
        verified
          ? `smoke/gas index ${S.smokeIndex.toFixed(0)} ≥ ${SMOKE_THRESHOLD}`
          : `<span style="color:var(--text-muted)">smoke/gas index ${S.smokeIndex.toFixed(0)}, below ${SMOKE_THRESHOLD}</span>`}</dd></div>
      <div class="fact"><dt>Dispatched</dt><dd>${
        verified ? '<b style="color:var(--bad-text)">yes — 17:44</b>' : '<b>no</b>'}</dd></div>
    </dl>

    ${verified ? `
      <ol class="timeline" style="margin-top:14px">
        <li><span class="t">17:42</span><span>Detected — possible smoke</span></li>
        <li><span class="t">17:44</span><span>Upgraded to Verified. Sensor TS-004 123 m from the camera: smoke/gas index ${S.smokeIndex.toFixed(0)} ≥ ${SMOKE_THRESHOLD}</span></li>
        <li><span class="t">17:44</span><span>Dispatched to webhook</span></li>
      </ol>` : `
      <div class="callout rule" style="margin-top:14px">
        <b>Not dispatched.</b> A camera alone is never enough. <b>Possible smoke</b> stays
        in the dashboard until a Torch sensor in that camera's view agrees within ±10 minutes.
        This is the product decision the whole system exists to prove.
      </div>`}

    <div style="margin-top:15px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" type="button" disabled>Real</button>
      <button class="btn" type="button" disabled>False alarm</button>
      <span class="sub" style="align-self:center">Operator role — disabled in this prototype</span>
    </div>`;
}

function eventTwo() {
  return `
    <div style="margin-bottom:13px">${chip('sensor_only')}</div>
    <dl class="facts">
      <div class="fact"><dt>Sensor</dt><dd>TS-007 · Bosque S 2</dd></div>
      <div class="fact"><dt>Reading</dt><dd>smoke/gas index 105 ≥ ${SMOKE_THRESHOLD}</dd></div>
      <div class="fact"><dt>Camera</dt><dd>none — no camera covers this ground</dd></div>
      <div class="fact"><dt>Dispatched</dt><dd><b style="color:var(--warn-text)">yes — 17:25</b></dd></div>
    </dl>
    <div class="callout rule" style="margin-top:14px">
      <b>A sensor with no camera still dispatches.</b> Sensors see what cameras cannot —
      smoke at night, gas, a hotspot behind a ridge. That is the argument for putting
      hardware in the blind spots.
    </div>`;
}

/* ===========================================================================
   Cameras
   =========================================================================== */
function camerasScreen() {
  return `
  <section class="card" aria-labelledby="feedH">
    <div style="display:flex;align-items:center;gap:11px;flex-wrap:wrap">
      <h2 id="feedH"><span class="feedbadge">local_folder</span> demo_local</h2>
      <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);font-weight:600">
        <i class="dot ok"></i>Reachable</span>
      <span class="sub">3 cameras · last success 17:42</span>
    </div>
    <div class="grid cols-3" style="margin-top:15px">
      ${CAMERAS.map((c) => `
        <article class="cam">
          <img src="${FRAMES[c.img]}" alt="Latest frame from ${esc(c.name)}, 5:42 PM">
          <div class="body">
            <span class="nm">${ICON.cam} ${esc(c.name)}</span>
            <span class="mt">Last frame 17:42 · score ${c.score.toFixed(2)}</span>
            <span class="mt">View changes today: <b>${c.changes}</b> · PTZ</span>
            ${c.moved ? `<span class="flag">${ICON.alert} View changed — alerts suppressed</span>` : ''}
          </div>
        </article>`).join('')}
    </div>
  </section>

  <section class="card" aria-labelledby="nmdotH">
    <div style="display:flex;align-items:center;gap:11px;flex-wrap:wrap">
      <h2 id="nmdotH"><span class="feedbadge">nmdot</span> nmdot_abq</h2>
      <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);font-weight:600">
        <i class="dot bad"></i>Unreachable</span>
      <span class="sub">0 cameras · 1 error</span>
    </div>
    <div class="feederr">${ICON.alert}
      <span>camera list failed: 403 Forbidden</span>
    </div>
    <p class="sub" style="margin-top:11px">
      A failing feed stays visible rather than vanishing — a broken feed and an unconfigured
      one must not look the same. Diagnose with <code>python -m feeds test nmdot_abq</code>.
    </p>
  </section>

  <section class="card">
    <div class="callout">
      Adding a camera is <b>one config block</b>. Six adapter types ship today:
      <code>nmdot</code>, <code>snapshot_url</code>, <code>rtsp</code>, <code>hls</code>,
      <code>local_folder</code> and a <code>verkada</code> stub — and a genuinely new
      source is one new file, with no change to detection, fusion or this UI.
    </div>
  </section>`;
}

/* ===========================================================================
   Dashboard
   =========================================================================== */
function dashboardScreen() {
  const verified = isVerified();
  const kpis = [
    ['Frames ingested', '75', '0 failed'],
    ['Camera alerts raised', '1', verified ? '0 still possible smoke' : '1 still possible smoke'],
    ['Verified', verified ? '1' : '0', 'camera + sensor agreed'],
    ['Sensor only', '1', 'no camera corroboration'],
    ['False alarms', '0', 'limit 3 per camera per day'],
    ['View changes', '1', 'limit 10 per camera per day'],
    ['Avg cost / frame', '$0.000000', 'target $0.001'],
  ];
  return `
  <section aria-labelledby="kpiH">
    <h2 id="kpiH" style="margin-bottom:13px">Kill-criteria metrics — today</h2>
    <div class="grid cols-kpi">
      ${kpis.map(([k, v, m]) => `
        <div class="card kpi"><span class="k">${esc(k)}</span>
        <span class="v">${esc(v)}</span><span class="m">${esc(m)}</span></div>`).join('')}
    </div>
  </section>

  <section class="card" aria-labelledby="bsH">
    <h2 id="bsH">Blind-spot summary</h2>
    <p style="margin-top:7px;font-weight:700;color:var(--text-strong)">
      Cameras see 5.8% of the corridor. 1,200 sensors cover 7,297 of the 7,495 blind acres.
      Hardware cost 1,200 &times; $299 = $358,800.
    </p>
    <dl class="facts" style="margin-top:13px">
      <div class="fact"><dt>Area of interest</dt><dd>Rio Grande Bosque Corridor — Albuquerque</dd></div>
      <div class="fact"><dt>Corridor</dt><dd>7,958 acres</dd></div>
      <div class="fact"><dt>Seen by cameras</dt><dd>463 acres (5.8%)</dd></div>
      <div class="fact"><dt>Blind</dt><dd>7,495 acres</dd></div>
      <div class="fact"><dt>Elevation source</dt><dd>AWS Terrain Tiles (real data, cached and checksummed)</dd></div>
      <div class="fact"><dt>Cameras used</dt><dd>3 (replay only — NMDOT feed unreachable)</dd></div>
    </dl>
    <p class="sub" style="margin-top:12px">
      Placement stopped at the 1,200-sensor cap; 198 acres remain uncovered. Figures are from
      the 23 Sep run and rise sharply once real cameras are ingesting.
    </p>
  </section>

  <section class="card" aria-labelledby="dispH">
    <h2 id="dispH">Dispatch</h2>
    <p class="sub" style="margin-bottom:12px">
      Only <b>verified</b> and <b>sensor only</b> ever leave the system. Every payload is
      HMAC-SHA256 signed and carries a login-gated link — never imagery, never credentials.
    </p>
    <div class="console" id="console">${consoleBody()}</div>
  </section>`;
}

function consoleBody() {
  const lines = [];
  lines.push('<pre><span class="d">$ python scripts/test_receiver.py</span>');
  lines.push('<span class="d">Dispatch test receiver on http://127.0.0.1:8001 (loopback only)</span>');
  lines.push('');
  for (const d of S.dispatches) {
    lines.push(`<span class="o">DISPATCH RECEIVED</span>  event=${d.id}`);
    lines.push('  - <span class="g">signature OK</span>');
    lines.push('  - <span class="g">timestamp skew 1s OK</span>');
    lines.push(`  {"status": "${d.status}", "severity": "${d.severity}",`);
    lines.push(`   "confirming_sensor_id": "${d.sensor}",`);
    lines.push(`   "confirmation": "${esc(d.detail)}",`);
    lines.push(`   "review_url": ".../events/${d.id}",${d.demo ? ' "demo": true,' : ''}`);
    lines.push('   "note": "This payload contains no imagery."}');
    lines.push('');
  }
  if (!isVerified()) {
    lines.push('<span class="d">// Event 1 is possible_smoke. Nothing sent. Waiting for a sensor.</span>');
  }
  lines.push('</pre>');
  return lines.join('\n');
}

/* ===========================================================================
   Render + events
   =========================================================================== */
const SCREEN_FN = { map: mapScreen, events: eventsScreen, cameras: camerasScreen, dashboard: dashboardScreen };

function renderSteps() {
  const steps = [
    ['Possible smoke', true],
    ['Sensor agrees', S.scenario !== 'idle'],
    ['Verified', isVerified()],
    ['Dispatched', isVerified()],
  ];
  $('#steps').innerHTML = steps
    .map(([label, on]) => `<span class="step" data-on="${on ? 1 : 0}">${esc(label)}</span>`).join('');

  const lead = $('#demoLead');
  if (S.scenario === 'idle') {
    lead.innerHTML = 'A camera has flagged <b>possible smoke</b>. Nobody has been paged. '
      + 'Run the fire scenario to make a Torch sensor agree.';
  } else if (S.scenario === 'ramping') {
    lead.innerHTML = `Sensor <b>TS-004</b> is ramping — smoke/gas index `
      + `<b>${S.smokeIndex.toFixed(0)}</b>. It verifies the camera at ${SMOKE_THRESHOLD}.`;
  } else {
    lead.innerHTML = 'Sensor <b>TS-004</b> agreed. The event is <b>Verified</b>, severity '
      + 'Critical, and the signed payload has reached the dispatch webhook.';
  }
  $('#runBtn').disabled = S.scenario !== 'idle';
}

function render() {
  renderNav();
  renderSteps();
  $('#screen').innerHTML = SCREEN_FN[S.screen]();
}

document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-screen]');
  if (nav) { S.screen = nav.dataset.screen; render(); window.scrollTo({ top: 0 }); return; }

  const go = e.target.closest('[data-goto]');
  if (go) { S.screen = go.dataset.goto; render(); window.scrollTo({ top: 0 }); return; }

  const row = e.target.closest('[data-event]');
  if (row) { S.selectedEvent = Number(row.dataset.event); render(); return; }
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest('[data-event]');
  if (row) { e.preventDefault(); S.selectedEvent = Number(row.dataset.event); render(); }
});

/* ---- the scenario ---- */
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let timer = null;

function verify() {
  S.scenario = 'verified';
  S.dispatches = [{
    id: 1, status: 'verified', severity: 'Critical', sensor: 'TS-004', at: '17:44',
    detail: `Sensor TS-004 123 m from the camera: smoke/gas index ${S.smokeIndex.toFixed(0)} ≥ ${SMOKE_THRESHOLD}`,
    demo: true,
  }, ...S.dispatches.filter((d) => d.id !== 1)];
  S.selectedEvent = 1;
  render();
}

$('#runBtn').addEventListener('click', () => {
  if (S.scenario !== 'idle') return;
  S.scenario = 'ramping';
  S.selectedEvent = 1;

  if (reduced) { S.smokeIndex = 66; S.thermalDelta = 4.4; verify(); return; }

  render();
  clearInterval(timer);
  timer = setInterval(() => {
    S.smokeIndex += 7.2;
    S.thermalDelta += 0.42;
    if (S.smokeIndex >= SMOKE_THRESHOLD + 6) {
      clearInterval(timer);
      verify();
    } else {
      renderSteps();
      if (S.screen === 'map' || S.screen === 'events') render();
    }
  }, 260);
});

$('#resetBtn').addEventListener('click', () => {
  clearInterval(timer);
  S.scenario = 'idle';
  S.smokeIndex = 12.4;
  S.thermalDelta = 1.2;
  S.selectedEvent = 1;
  S.dispatches = [{
    id: 2, status: 'sensor_only', severity: 'Warning', sensor: 'TS-007',
    at: '17:25', detail: 'Sensor TS-007: smoke/gas index 105 ≥ 60', demo: false,
  }];
  render();
});

/* ---- theme toggle ---- */
const themeBtn = $('#themeBtn');
function syncTheme() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.hasAttribute('data-theme')
        && window.matchMedia('(prefers-color-scheme: dark)').matches);
  themeBtn.textContent = dark ? 'Light' : 'Dark';
  themeBtn.setAttribute('aria-pressed', String(dark));
}
themeBtn.addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.hasAttribute('data-theme')
        && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  syncTheme();
});
syncTheme();

render();
</script>
